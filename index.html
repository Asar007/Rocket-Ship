<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#03061a" />
    <meta name="robots" content="index, follow" />

    <!-- Global social tags; per-page title/description/url/canonical are
         injected per route by src/lib/seo.jsx (vite-react-ssg <Head>). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Madras Swastic Engineers" />
    <meta
      property="og:image"
      content="https://www.madrasswastic.com/favicon.png"
    />
    <meta property="og:image:alt" content="Madras Swastic Engineers logo" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:image"
      content="https://www.madrasswastic.com/favicon.png"
    />

    <!-- Structured data — LocalBusiness for Google rich results / maps -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Madras Swastic Engineers",
        "description": "Turnkey industrial engineering firm delivering structural fabrication, plant erection, and precision mechanical solutions for energy, refinery, and manufacturing leaders across India. Fabrication partner on ISRO's Gaganyaan crew module programme.",
        "url": "https://www.madrasswastic.com/",
        "image": "https://www.madrasswastic.com/favicon.png",
        "logo": "https://www.madrasswastic.com/favicon.png",
        "email": "md@madrasswastic.com",
        "telephone": "+91-98841-48474",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "21-C, 5th Cross St, South Phase, Guindy Industrial Estate, Guindy",
          "addressLocality": "Chennai",
          "addressRegion": "Tamil Nadu",
          "postalCode": "600032",
          "addressCountry": "IN"
        },
        "areaServed": "IN"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Document title intentionally omitted here: injected per route by
         src/lib/seo.jsx (react-helmet via vite-react-ssg). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
